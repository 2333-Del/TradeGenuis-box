services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradegenuis}
      POSTGRES_USER: ${POSTGRES_USER:-tradegenuis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在docker/.env设置数据库密码}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  dashboard:
    depends_on:
      postgres:
        condition: service_healthy
    # 构建：上下文为仓库根（Dockerfile 的 COPY 源码相对根目录）；
    # 注意 dockerfile 字段相对「上下文」解析（不是相对本文件），所以是 docker/Dockerfile
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tradegenuis
    restart: unless-stopped
    ports:
      # 左边是对外端口（可改成任意不显眼端口），右边 8808 是容器内固定端口，不用动
      # 对公网开放前建议改为 "127.0.0.1:12300:8808"，由 Nginx/Caddy 反代加 HTTPS
      - "12300:8808"
    environment:
      # 所有值从 docker/.env 读取（复制 docker/.env.example 为 docker/.env 后填写）。
      # compose -f docker/docker-compose.yml 启动时自动加载 compose 文件同目录的 .env；
      # 也可以不改文件，直接在启动前 export 环境变量（shell 变量优先级高于 .env）。
      # 不设密码 = 服务只允许本机访问（容器内等于全部拒绝），公网部署必设
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-tradegenuis}
      PGUSER: ${POSTGRES_USER:-tradegenuis}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请设置数据库密码}
      # Telegram 推送（可选，留空则用看板 banner 里保存的配置）
      TG_BOT_TOKEN: "${TG_BOT_TOKEN:-}"
      TG_CHAT_ID: "${TG_CHAT_ID:-}"
    volumes:
      - ../data:/app/data   # 扫描结果/缓存/自选池/配置 持久化在仓库根 data/（相对本文件）

volumes:
  pgdata:
